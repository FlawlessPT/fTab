    tag: "&c[ADMIN]"
  - group: vip
    tag: "&2[VIP]"
default-tag: "&7[Membro]"
update-seconds: 5
# Cabeçalho e rodapé da lista de jogadores (uma linha por entrada, cores com &; vazio = não envia)
header:
  - "&6&lFlawless"
footer:
  - "&7Bem-vindo ao servidor"
